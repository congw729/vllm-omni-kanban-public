name: Build MkDocs Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'scripts/mkdocs_hooks.py'
      - 'scripts/check_mkdocs_model_coverage.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: mkdocs build --strict

      - run: python scripts/check_mkdocs_model_coverage.py || true

      - name: Deploy MkDocs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: pages
          keep_files: true
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deployed MkDocs build ${{ github.sha }}'

      - name: Checkout gh-pages for root cleanup
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Remove legacy MkDocs root files
        working-directory: gh-pages
        run: |
          rm -rf 404.html index.html sitemap.xml sitemap.xml.gz assets search models alerts reports comparisons
          if git diff --quiet; then
            echo "no legacy root MkDocs files to remove"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(pages): remove legacy MkDocs root files"
          git push
